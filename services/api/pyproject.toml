[project]
name = "lunar-api"
version = "0.0.1"
description = "Thin FastAPI service for the Lunar Landing Site Navigator."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi", "uvicorn[standard]", "gunicorn", "pydantic>=2", "orjson", "httpx", "tenacity",
  "sqlalchemy>=2", "alembic", "psycopg[binary]>=3", "redis", "arq", "lunar-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_api"]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
]
