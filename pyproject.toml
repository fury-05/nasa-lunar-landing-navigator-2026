[project]
name = "lunar-navigator"
version = "0.0.1"
description = "Lunar Landing Site Navigator workspace root (NASA Space Apps 2026). Planning tool, not for flight operations."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["lunar-engine", "lunar-api"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6", "respx>=0.21", "fakeredis>=2.40"]

[tool.uv]
# Only use releases at least 14 days old (docs/03 policy). Raise this date deliberately.
exclude-newer = "2026-10-31T00:00:00Z"

[tool.uv.workspace]
members = ["packages/engine", "services/api"]

[tool.uv.sources]
lunar-engine = { workspace = true }
lunar-api = { workspace = true }

[tool.ruff]
extend-exclude = ["scripts"]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["packages/engine/src", "services/api/src", "packages/engine/tests", "services/api/tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["packages/engine/tests", "services/api/tests"]
testpaths = ["packages", "services"]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lunar_engine.skyline"]
disallow_untyped_decorators = false
