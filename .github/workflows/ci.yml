name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: bash scripts/lint-dashes.sh
      - run: python3 scripts/checklist.py --check
      - name: PR title format
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,72}$'
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - if: hashFiles('pyproject.toml') != ''
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run mypy packages services
          uv run pytest -q --cov
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - if: hashFiles('apps/web/package.json') != ''
        run: |
          npm ci
          npm run lint --workspace apps/web
          npm run format:check --workspace apps/web
          npm run typecheck --workspace apps/web
          npm test --workspace apps/web -- --run
          npm run build --workspace apps/web
          npm run licenses --workspace apps/web
          npx playwright install --with-deps chromium
          npm run e2e --workspace apps/web
