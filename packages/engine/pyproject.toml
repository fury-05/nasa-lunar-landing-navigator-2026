[project]
name = "lunar-engine"
version = "0.0.1"
description = "Pure Python compute for the Lunar Landing Site Navigator: ephemeris, terrain, visibility, metrics."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "httpx", "tenacity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_engine"]
