<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Terrain tiers</title><desc id="d">A site with 5 m data near it, a 5 m mosaic near the pole and a 20 m map out to 300 km, with rays in every direction.</desc>
<rect width="900" height="430" rx="14" fill="#0b1020"/>
<text x="450" y="34" fill="#e6ebf5" font-size="20" font-weight="700" text-anchor="middle">Terrain tiers: the finest valid data is used at every step</text><rect x="60.0" y="50.0" width="400" height="340" rx="6" fill="#141c33" stroke="#5b6578" stroke-dasharray="6,5"/><circle cx="260.0" cy="220.0" r="150" fill="#5aa9ff" opacity="0.10" stroke="#5aa9ff" stroke-width="1.6"/><circle cx="260.0" cy="220.0" r="34" fill="#3ddbc4" opacity="0.25" stroke="#3ddbc4" stroke-width="1.6"/><line x1="260.0" y1="220.0" x2="260.0" y2="70.0" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="335.0" y2="90.1" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="389.9" y2="145.0" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="410.0" y2="220.0" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="389.9" y2="295.0" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="335.0" y2="349.9" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="260.0" y2="370.0" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="185.0" y2="349.9" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="130.1" y2="295.0" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="110.0" y2="220.0" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="130.1" y2="145.0" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><line x1="260.0" y1="220.0" x2="185.0" y2="90.1" stroke="#ffb347" stroke-width="0.8" opacity="0.6"/><circle cx="260.0" cy="220.0" r="5" fill="#ffb347"/><circle cx="380.0" cy="120.0" r="4" fill="#e6ebf5"/><text x="388.0" y="122.0" fill="#e6ebf5" font-size="12" font-weight="400" text-anchor="start">south pole</text><text x="268.0" y="240.0" fill="#ffb347" font-size="12" font-weight="400" text-anchor="start">site</text><text x="65.0" y="410.0" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">20 m LDEM square, 608 km wide, centred on the pole</text><rect x="500" y="78" width="380" height="64" rx="9" fill="#141c33" stroke="#3ddbc4" stroke-width="1.6"/><text x="514" y="102" fill="#e6ebf5" font-size="14" font-weight="700" text-anchor="start">Tier 1: 5 m site tile</text><text x="514" y="120" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">PGDA site product, 8 to 16 km wide</text><text x="514" y="136" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">used within 20 km of the site</text><rect x="500" y="154" width="380" height="64" rx="9" fill="#141c33" stroke="#3ddbc4" stroke-width="1.6"/><text x="514" y="178" fill="#e6ebf5" font-size="14" font-weight="700" text-anchor="start">Tier 2: 5 m mosaic 87S to 90S</text><text x="514" y="196" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">PGDA product 81</text><text x="514" y="212" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">used within 20 km when it has data</text><rect x="500" y="230" width="380" height="64" rx="9" fill="#141c33" stroke="#5aa9ff" stroke-width="1.6"/><text x="514" y="254" fill="#e6ebf5" font-size="14" font-weight="700" text-anchor="start">Tier 3: 20 m LDEM</text><text x="514" y="272" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">PGDA product 90 (plus ERR, EFFRES)</text><text x="514" y="288" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">used out to the required 300 km</text><text x="500" y="330" fill="#9aa7c0" font-size="12.5" font-weight="400" text-anchor="start">A ray ends only when no tier has data, so it never stops at a</text><text x="500" y="348" fill="#9aa7c0" font-size="12.5" font-weight="400" text-anchor="start">fine tile's edge while a wider tier still covers the ground.</text><text x="500" y="372" fill="#ffb347" font-size="12.5" font-weight="400" text-anchor="start">Reach per direction is measured and shown, never assumed.</text><text x="500" y="392" fill="#9aa7c0" font-size="12.5" font-weight="400" text-anchor="start">Share of directions reaching 300 km: 46% to 95% across the</text><text x="500" y="410" fill="#9aa7c0" font-size="12.5" font-weight="400" text-anchor="start">ten curated sites, so every verdict is an upper bound.</text>
</svg>
