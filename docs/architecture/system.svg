<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">System architecture</title><desc id="d">NASA data feeds an offline engine that writes bundles; a FastAPI service behind Caddy serves them to a React app; a worker builds custom sites.</desc>
<rect width="1000" height="410" rx="14" fill="#0b1020"/>
<text x="500" y="34" fill="#e6ebf5" font-size="20" font-weight="700" text-anchor="middle">System architecture (as built)</text><text x="60" y="70" fill="#9aa7c0" font-size="13" font-weight="700" text-anchor="start">NASA data sources</text><rect x="40" y="80" width="190" height="52" rx="9" fill="#141c33" stroke="#ffb347" stroke-width="1.6"/><text x="135.0" y="102.0" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">JPL Horizons</text><text x="135.0" y="121.0" fill="#9aa7c0" font-size="12" text-anchor="middle">Sun and Earth az/el</text><rect x="40" y="150" width="190" height="52" rx="9" fill="#141c33" stroke="#ffb347" stroke-width="1.6"/><text x="135.0" y="172.0" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">NASA GSFC PGDA</text><text x="135.0" y="191.0" fill="#9aa7c0" font-size="12" text-anchor="middle">LOLA heights 5 m / 20 m</text><rect x="40" y="220" width="190" height="52" rx="9" fill="#141c33" stroke="#ffb347" stroke-width="1.6"/><text x="135.0" y="242.0" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">Moon Trek</text><text x="135.0" y="261.0" fill="#9aa7c0" font-size="12" text-anchor="middle">polar map tiles (WMTS)</text><text x="300" y="70" fill="#9aa7c0" font-size="13" font-weight="700" text-anchor="start">Offline and worker compute</text><rect x="285" y="80" width="230" height="100" rx="9" fill="#141c33" stroke="#3ddbc4" stroke-width="1.6"/><text x="400.0" y="135.0" fill="#e6ebf5" font-size="16" font-weight="700" text-anchor="middle"></text><text x="400" y="108" fill="#e6ebf5" font-size="16" font-weight="700" text-anchor="middle">Engine (Python, numba)</text><text x="400" y="128" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">ephemeris, skyline, visibility,</text><text x="400" y="146" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">events, metrics, sensitivity</text><rect x="285" y="200" width="230" height="60" rx="9" fill="#141c33" stroke="#3ddbc4" stroke-width="1.6"/><text x="400.0" y="226.0" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">Precomputed bundles</text><text x="400.0" y="245.0" fill="#9aa7c0" font-size="12" text-anchor="middle">10 sites, 3 years, 10 min steps</text><text x="580" y="70" fill="#9aa7c0" font-size="13" font-weight="700" text-anchor="start">Runtime on one AWS VM</text><rect x="575" y="80" width="160" height="60" rx="9" fill="#141c33" stroke="#5aa9ff" stroke-width="1.6"/><text x="655.0" y="106.0" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">Caddy</text><text x="655.0" y="125.0" fill="#9aa7c0" font-size="12" text-anchor="middle">TLS, static files, /api proxy</text><rect x="575" y="165" width="160" height="70" rx="9" fill="#141c33" stroke="#5aa9ff" stroke-width="1.6"/><text x="655.0" y="196.0" fill="#e6ebf5" font-size="16" font-weight="700" text-anchor="middle">FastAPI</text><text x="655.0" y="215.0" fill="#9aa7c0" font-size="13" text-anchor="middle">read only /api/v1</text><rect x="575" y="260" width="160" height="52" rx="9" fill="#141c33" stroke="#5aa9ff" stroke-width="1.6"/><text x="655.0" y="282.0" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">arq worker</text><text x="655.0" y="301.0" fill="#9aa7c0" font-size="12" text-anchor="middle">custom site jobs</text><rect x="770" y="150" width="120" height="46" rx="9" fill="#141c33" stroke="#5aa9ff" stroke-width="1.6"/><text x="830.0" y="169.0" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">PostgreSQL</text><text x="830.0" y="188.0" fill="#9aa7c0" font-size="12" text-anchor="middle">sites, jobs</text><rect x="770" y="215" width="120" height="46" rx="9" fill="#141c33" stroke="#5aa9ff" stroke-width="1.6"/><text x="830.0" y="234.0" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">Redis</text><text x="830.0" y="253.0" fill="#9aa7c0" font-size="12" text-anchor="middle">queue, progress</text><rect x="790" y="80" width="170" height="60" rx="9" fill="#141c33" stroke="#ffb347" stroke-width="1.6"/><text x="875.0" y="106.0" fill="#e6ebf5" font-size="16" font-weight="700" text-anchor="middle">Browser</text><text x="875.0" y="125.0" fill="#9aa7c0" font-size="13" text-anchor="middle">React 19 app</text><rect x="790" y="285" width="170" height="52" rx="9" fill="#141c33" stroke="#5b6578" stroke-width="1.6"/><text x="875.0" y="307.0" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">QuickMap</text><text x="875.0" y="326.0" fill="#9aa7c0" font-size="12" text-anchor="middle">link only, no data copied</text><line x1="230" y1="106" x2="276.2" y2="116.1" stroke="#ffb347" stroke-width="2"/><polygon points="285,118 277.3,111.2 275.1,121.0" fill="#ffb347"/><text x="262" y="88" fill="#ffb347" font-size="12" text-anchor="middle">1 request/s</text><line x1="230" y1="176" x2="276.9" y2="153.8" stroke="#ffb347" stroke-width="2"/><polygon points="285,150 274.7,149.3 279.0,158.4" fill="#ffb347"/><line x1="400" y1="180" x2="400.0" y2="191.0" stroke="#3ddbc4" stroke-width="2"/><polygon points="400,200 405.0,191.0 395.0,191.0" fill="#3ddbc4"/><line x1="515" y1="230" x2="566.7" y2="208.5" stroke="#3ddbc4" stroke-width="2"/><polygon points="575,205 564.8,203.8 568.6,213.1" fill="#3ddbc4"/><text x="540" y="250" fill="#3ddbc4" font-size="12" text-anchor="middle">load</text><line x1="790" y1="110" x2="744.0" y2="110.0" stroke="#5aa9ff" stroke-width="2"/><polygon points="735,110 744.0,115.0 744.0,105.0" fill="#5aa9ff"/><text x="763" y="104" fill="#5aa9ff" font-size="12" text-anchor="middle">HTTPS</text><line x1="655" y1="140" x2="655.0" y2="156.0" stroke="#5aa9ff" stroke-width="2"/><polygon points="655,165 660.0,156.0 650.0,156.0" fill="#5aa9ff"/><line x1="735" y1="190" x2="761.7" y2="178.5" stroke="#9aa7c0" stroke-width="2"/><polygon points="770,175 759.8,173.9 763.7,183.1" fill="#9aa7c0"/><line x1="735" y1="215" x2="762.2" y2="230.5" stroke="#9aa7c0" stroke-width="2"/><polygon points="770,235 764.7,226.2 759.7,234.9" fill="#9aa7c0"/><line x1="655" y1="260" x2="655.0" y2="244.0" stroke="#9aa7c0" stroke-width="2" stroke-dasharray="4,3"/><polygon points="655,235 650.0,244.0 660.0,244.0" fill="#9aa7c0"/><line x1="575" y1="290" x2="519.0" y2="178.0" stroke="#3ddbc4" stroke-width="2" stroke-dasharray="4,3"/><polygon points="515,170 514.6,180.3 523.5,175.8" fill="#3ddbc4"/><text x="535" y="310" fill="#3ddbc4" font-size="12" text-anchor="middle">job runs engine</text><line x1="230" y1="250" x2="781.1" y2="328.7" stroke="#ffb347" stroke-width="2" stroke-dasharray="5,4"/><polygon points="790,330 781.8,323.8 780.4,333.7" fill="#ffb347"/><text x="430" y="322" fill="#ffb347" font-size="12" text-anchor="middle">map tiles go straight to the browser</text><line x1="875" y1="285" x2="875.0" y2="149.0" stroke="#ffb347" stroke-width="2" stroke-dasharray="5,4"/><polygon points="875,140 870.0,149.0 880.0,149.0" fill="#ffb347"/><text x="40" y="372" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">Amber: NASA data in. Teal: deterministic compute. Blue: request path. Dashed: background or optional.</text><text x="40" y="392" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">No machine learning in any number. Terrain and bundles live outside git (sha256 in data/MANIFEST.json).</text>
</svg>
