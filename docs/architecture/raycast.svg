<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Ray casting geometry</title><desc id="d">An observer on a sphere looks at a terrain sample at distance d; the elevation angle e includes the curvature drop.</desc>
<rect width="900" height="610" rx="14" fill="#0b1020"/>
<text x="450" y="34" fill="#e6ebf5" font-size="20" font-weight="700" text-anchor="middle">One ray: curvature-aware elevation of a terrain point</text><path d="M 56.0 395.7 A 640.0 640.0 0 0 1 844.0 395.7" fill="none" stroke="#5b6578" stroke-width="3"/><polygon points="694.9,308.7 717.2,285.6 744.4,253.9 770.7,227.6 766.8,264.6 763.1,298.6 755.4,337.6" fill="#5b6578" opacity="0.7" stroke="#5b6578"/><line x1="224.3" y1="279.8" x2="231.1" y2="298.6" stroke="#e6ebf5" stroke-width="2"/><line x1="224.3" y1="279.8" x2="268.0" y2="400" stroke="#9aa7c0" stroke-dasharray="5,5"/><line x1="770.7" y1="227.6" x2="688.5" y2="400" stroke="#9aa7c0" stroke-dasharray="5,5"/><text x="214.26670540505864" y="396" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="end">to the Moon centre</text><line x1="154.3" y1="279.8" x2="824.3" y2="279.8" stroke="#5aa9ff" stroke-width="1.6" stroke-dasharray="7,5"/><text x="744.2667054050587" y="297.80287028130044" fill="#5aa9ff" font-size="12" font-weight="400" text-anchor="start">local horizontal</text><line x1="224.3" y1="279.8" x2="554.3" y2="245.9" stroke="#3ddbc4" stroke-width="1.6" stroke-dasharray="3,4"/><text x="434.2667054050587" y="269.93997647746164" fill="#3ddbc4" font-size="12" font-weight="400" text-anchor="start">bare-sphere horizon (the dip)</text><line x1="224.3" y1="279.8" x2="770.7" y2="227.6" stroke="#ffb347" stroke-width="2.6"/><path d="M 314.3 279.8 A 90 90 0 0 0 313.9 271.2" fill="none" stroke="#ffb347" stroke-width="2"/><text x="322.26670540505864" y="267.80287028130044" fill="#ffb347" font-size="20" font-weight="700" text-anchor="start">e</text><circle cx="224.3" cy="279.8" r="6" fill="#ffb347"/><circle cx="770.7" cy="227.6" r="5" fill="#e6ebf5"/><text x="220.26670540505864" y="261.80287028130044" fill="#e6ebf5" font-size="13" font-weight="700" text-anchor="middle">observer, eye height h0</text><text x="770.7307671221799" y="213.57396315935387" fill="#e6ebf5" font-size="13" font-weight="700" text-anchor="middle">terrain sample, height z</text><text x="453.1034668170556" y="186.40327251335862" fill="#9aa7c0" font-size="13" font-weight="700" text-anchor="middle">ground distance d, angle theta = d / R</text><text x="450" y="424" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">Heights are exaggerated in this picture so the angles can be seen.</text><rect x="20" y="440" width="860" height="150" rx="10" fill="#141c33" stroke="#5b6578"/><text x="36" y="468" fill="#e6ebf5" font-size="13.5" font-weight="700" text-anchor="start">For each of 1,440 azimuths (every 0.25 degrees), step outward along the ground:</text><text x="36" y="490" fill="#9aa7c0" font-size="12.5" font-weight="400" text-anchor="start">1  theta = d / R, with R = 1,737,400 m.   2  Find the point by great-circle destination of (lat, lon, azimuth, d).</text><text x="36" y="512" fill="#9aa7c0" font-size="12.5" font-weight="400" text-anchor="start">3  Project it to south polar stereographic metres.   4  Read z by bilinear sampling of the finest valid DEM tier.</text><text x="36" y="534" fill="#ffb347" font-size="13" font-weight="400" text-anchor="start">5  e = atan2( (R + z) cos(theta) - (R + h0),  (R + z) sin(theta) )      this already contains the curvature drop.</text><text x="36" y="556" fill="#e6ebf5" font-size="12.5" font-weight="700" text-anchor="start">Skyline(azimuth) = the largest e along the ray, never lower than the bare-sphere dip  -acos( (R + z_site) / (R + z_site + h_eye) ).</text><text x="36" y="578" fill="#9aa7c0" font-size="12.5" font-weight="400" text-anchor="start">The ray also records how far it got, so every azimuth reports its reach in km.</text>
</svg>
