<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Calculation pipeline</title><desc id="d">Six stages from ephemeris to sensitivity band, with the formula used at each stage.</desc>
<rect width="1000" height="410" rx="14" fill="#0b1020"/>
<text x="500" y="34" fill="#e6ebf5" font-size="20" font-weight="700" text-anchor="middle">How one site is calculated</text><rect x="20" y="64" width="150" height="120" rx="10" fill="#141c33" stroke="#ffb347" stroke-width="1.8"/><text x="95.0" y="92" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">1 Ephemeris</text><text x="95.0" y="122" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">Horizons: Sun and Earth</text><text x="95.0" y="142" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">azimuth, elevation, size</text><line x1="172" y1="124" x2="175.0" y2="124.0" stroke="#9aa7c0" stroke-width="2"/><polygon points="184,124 175.0,119.0 175.0,129.0" fill="#9aa7c0"/><rect x="186" y="64" width="150" height="120" rx="10" fill="#141c33" stroke="#3ddbc4" stroke-width="1.8"/><text x="261.0" y="92" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">2 Skyline</text><text x="261.0" y="122" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">1,440 rays, 0.25 deg</text><text x="261.0" y="142" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">out to 300 km</text><line x1="338" y1="124" x2="341.0" y2="124.0" stroke="#9aa7c0" stroke-width="2"/><polygon points="350,124 341.0,119.0 341.0,129.0" fill="#9aa7c0"/><rect x="352" y="64" width="150" height="120" rx="10" fill="#141c33" stroke="#3ddbc4" stroke-width="1.8"/><text x="427.0" y="92" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">3 Disc visibility</text><text x="427.0" y="122" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">65 strips per disc</text><text x="427.0" y="142" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">share of Sun above skyline</text><line x1="504" y1="124" x2="507.0" y2="124.0" stroke="#9aa7c0" stroke-width="2"/><polygon points="516,124 507.0,119.0 507.0,129.0" fill="#9aa7c0"/><rect x="518" y="64" width="150" height="120" rx="10" fill="#141c33" stroke="#3ddbc4" stroke-width="1.8"/><text x="593.0" y="92" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">4 Events</text><text x="593.0" y="122" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">Hermite spline +</text><text x="593.0" y="142" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">bisection to 1 s</text><line x1="670" y1="124" x2="673.0" y2="124.0" stroke="#9aa7c0" stroke-width="2"/><polygon points="682,124 673.0,119.0 673.0,129.0" fill="#9aa7c0"/><rect x="684" y="64" width="150" height="120" rx="10" fill="#141c33" stroke="#3ddbc4" stroke-width="1.8"/><text x="759.0" y="92" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">5 Metrics</text><text x="759.0" y="122" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">sunlight, dark spell,</text><text x="759.0" y="142" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">Earth link, outage</text><line x1="836" y1="124" x2="839.0" y2="124.0" stroke="#9aa7c0" stroke-width="2"/><polygon points="848,124 839.0,119.0 839.0,129.0" fill="#9aa7c0"/><rect x="850" y="64" width="150" height="120" rx="10" fill="#141c33" stroke="#5aa9ff" stroke-width="1.8"/><text x="925.0" y="92" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="middle">6 Sensitivity</text><text x="925.0" y="122" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">skyline -d, 0, +d</text><text x="925.0" y="142" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">verdict robust or fragile</text><text x="95" y="216" fill="#ffb347" font-size="11.5" font-weight="400" text-anchor="middle">az, el of Sun/Earth</text><text x="95" y="232" fill="#ffb347" font-size="11.5" font-weight="400" text-anchor="middle">angular radius</text><text x="95" y="248" fill="#ffb347" font-size="11.5" font-weight="400" text-anchor="middle">asin(Rbody / distance)</text><text x="261" y="216" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">e = atan2(</text><text x="261" y="232" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">(R+z)cos(d/R) - (R+h0),</text><text x="261" y="248" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">(R+z)sin(d/R) )</text><text x="427" y="216" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">F = sum(visible x width)</text><text x="427" y="232" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">/ (pi rho^2)</text><text x="427" y="248" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">Sun up if F >= 0.5</text><text x="593" y="216" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">refine crossings of</text><text x="593" y="232" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">a level to 1 second</text><text x="593" y="248" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">rise, set, Earthrise, Earthset</text><text x="759" y="216" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">power = F sin(el)</text><text x="759" y="232" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">x (AU/dist)^2 x 1361</text><text x="759" y="248" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">Earth up: el > skyline</text><text x="925" y="216" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">delta = max(0.1,</text><text x="925" y="232" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">sqrt(skyline^2 + frame^2))</text><text x="925" y="248" fill="#3ddbc4" font-size="11.5" font-weight="400" text-anchor="middle">runs at +delta, 0, -delta</text><rect x="20" y="276" width="960" height="112" rx="10" fill="#141c33" stroke="#5b6578" stroke-width="1.4"/><text x="40" y="304" fill="#e6ebf5" font-size="14" font-weight="700" text-anchor="start">Outputs shown on screen</text><text x="40" y="328" fill="#9aa7c0" font-size="13" font-weight="400" text-anchor="start">Verdict: Viable, Marginal, Not viable, or amber Upper bound (terrain incomplete). Robust or fragile tag.</text><text x="40" y="350" fill="#9aa7c0" font-size="13" font-weight="400" text-anchor="start">Sunlight hours, Sun share, longest dark spell, Earth link share, longest outage, each with a low to high range.</text><text x="40" y="372" fill="#9aa7c0" font-size="13" font-weight="400" text-anchor="start">Provenance: sources, assumptions, terrain reach per direction, covered share. Planning tool, not for flight operations.</text>
</svg>
