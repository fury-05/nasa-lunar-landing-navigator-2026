<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Disc visibility</title><desc id="d">A Sun disc cut into vertical strips against a jagged skyline; strips above the skyline are lit.</desc>
<rect width="800" height="370" rx="14" fill="#0b1020"/>
<text x="400" y="34" fill="#e6ebf5" font-size="20" font-weight="700" text-anchor="middle">Visible share of the Sun disc above the skyline</text><defs><clipPath id="below"><path d="M 40,270 L 110,255 L 170,215 L 230,205 L 290,150 L 340,190 L 400,215 L 470,250 L 470,330 L 40,330 Z"/></clipPath><clipPath id="above"><path d="M 40,270 L 110,255 L 170,215 L 230,205 L 290,150 L 340,190 L 400,215 L 470,250 L 470,60 L 40,60 Z"/></clipPath></defs><circle cx="250.0" cy="190.0" r="100.0" fill="#ffb347" clip-path="url(#above)"/><circle cx="250.0" cy="190.0" r="100.0" fill="#ffb347" opacity="0.18" clip-path="url(#below)"/><line x1="150.7" y1="177.9" x2="150.7" y2="202.1" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="156.5" y1="154.5" x2="156.5" y2="225.5" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="167.7" y1="133.2" x2="167.7" y2="246.8" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="183.7" y1="115.1" x2="183.7" y2="264.9" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="203.5" y1="101.5" x2="203.5" y2="278.5" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="226.1" y1="92.9" x2="226.1" y2="287.1" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="250.0" y1="90.0" x2="250.0" y2="290.0" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="273.9" y1="92.9" x2="273.9" y2="287.1" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="296.5" y1="101.5" x2="296.5" y2="278.5" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="316.3" y1="115.1" x2="316.3" y2="264.9" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="332.3" y1="133.2" x2="332.3" y2="246.8" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="343.5" y1="154.5" x2="343.5" y2="225.5" stroke="#0b1020" stroke-width="1" opacity="0.7"/><line x1="349.3" y1="177.9" x2="349.3" y2="202.1" stroke="#0b1020" stroke-width="1" opacity="0.7"/><path d="M 40,270 L 110,255 L 170,215 L 230,205 L 290,150 L 340,190 L 400,215 L 470,250 L 470,330 L 40,330 Z" fill="#5b6578" opacity="0.85"/><path d="M 40,270 L 110,255 L 170,215 L 230,205 L 290,150 L 340,190 L 400,215 L 470,250" fill="none" stroke="#e6ebf5" stroke-width="2.4"/><circle cx="250.0" cy="190.0" r="100.0" fill="none" stroke="#ffb347" stroke-width="1.6"/><circle cx="250.0" cy="190.0" r="3" fill="#0b1020"/><text x="60" y="300" fill="#e6ebf5" font-size="13" font-weight="700" text-anchor="start">terrain skyline h(azimuth)</text><text x="250.0" y="58" fill="#ffb347" font-size="13" font-weight="700" text-anchor="middle">Sun disc, angular radius rho</text><text x="362.0" y="140.0" fill="#ffb347" font-size="12" font-weight="400" text-anchor="start">visible strips</text><text x="260.0" y="252.0" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="start">hidden</text><rect x="500" y="64" width="280" height="262" rx="10" fill="#141c33" stroke="#5b6578"/><text x="514" y="90.0" fill="#e6ebf5" font-size="12.2" font-weight="700" text-anchor="start">The disc is cut into 65 strips</text><text x="514" y="109.5" fill="#9aa7c0" font-size="12.2" font-weight="400" text-anchor="start">t = -pi/2 + (i + 0.5) pi/65</text><text x="514" y="129.0" fill="#9aa7c0" font-size="12.2" font-weight="400" text-anchor="start">offset x = rho sin t</text><text x="514" y="148.5" fill="#9aa7c0" font-size="12.2" font-weight="400" text-anchor="start">half height s = rho cos t</text><text x="514" y="168.0" fill="#9aa7c0" font-size="12.2" font-weight="400" text-anchor="start">width = rho cos t (pi/65)</text><text x="514" y="187.5" fill="#9aa7c0" font-size="12.2" font-weight="400" text-anchor="start">skyline under strip = h(az + x / cos el)</text><text x="514" y="207.0" fill="#ffb347" font-size="12.2" font-weight="400" text-anchor="start">visible = clamp( (el+s) - max(h, el-s), 0, 2s )</text><text x="514" y="226.5" fill="#ffb347" font-size="12.2" font-weight="400" text-anchor="start">F = sum(visible x width) / (pi rho^2)</text><text x="514" y="246.0" fill="#e6ebf5" font-size="12.2" font-weight="700" text-anchor="start">Sun counts as up when F >= 0.5</text><text x="514" y="265.5" fill="#9aa7c0" font-size="12.2" font-weight="400" text-anchor="start">(the centre of the disc is on the skyline)</text><text x="514" y="285.0" fill="#e6ebf5" font-size="12.2" font-weight="700" text-anchor="start">Earth link: centre elevation > skyline</text><text x="514" y="304.5" fill="#9aa7c0" font-size="12.2" font-weight="400" text-anchor="start">rho = asin(body radius / distance)</text><text x="400" y="350" fill="#9aa7c0" font-size="12" font-weight="400" text-anchor="middle">No atmosphere on the Moon, so no refraction is applied.</text>
</svg>
